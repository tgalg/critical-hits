services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: critical_hits
      POSTGRES_PASSWORD: critical_hits
      POSTGRES_DB: critical_hits
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U critical_hits -d critical_hits"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
